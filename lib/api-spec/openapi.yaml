openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversion
    description: Document conversion operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /convert:
    post:
      operationId: convertDocument
      tags: [conversion]
      summary: Convert uploaded documents
      description: Extracts native text from supported documents, uses OCR for images or scanned pages, or exports Word and PowerPoint files to PDF.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ConversionInput"
      responses:
        "200":
          description: Converted Markdown document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionBatchResult"
        "400":
          description: Unsupported or invalid file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Conversion failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ConversionInput:
      type: object
      required:
        - file
      properties:
        file:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: binary
        mode:
          type: string
          enum: [structured, plain]
          default: structured
        ocrLanguage:
          type: string
          default: eng
        target:
          type: string
          enum: [markdown, pdf]
          default: markdown
    ConversionItem:
      type: object
      required:
        - filename
        - status
      properties:
        filename:
          type: string
        status:
          type: string
          enum: [success, error]
        markdown:
          type: ["string", "null"]
        sourceType:
          type: ["string", "null"]
          enum: [pdf, docx, pptx, image, text]
        usedOcr:
          type: boolean
        characterCount:
          type: ["integer", "null"]
        wordCount:
          type: ["integer", "null"]
        pageCount:
          type: ["integer", "null"]
        warning:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        outputBase64:
          type: ["string", "null"]
        outputMimeType:
          type: ["string", "null"]
        outputFilename:
          type: ["string", "null"]
    ConversionBatchResult:
      type: object
      required:
        - results
        - totalFiles
        - successCount
        - failureCount
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ConversionItem"
        totalFiles:
          type: integer
        successCount:
          type: integer
        failureCount:
          type: integer
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

